#
# UCNG Musik-Bot – MP3s aus einem Ordner oder YouTube-Videos/-Playlists in Sprachkanäle
#   1. Admin → Bots: Bot mit den Rechten „Schreiben“ und „Musik“ anlegen, Token kopieren
#   2. Admin → Kanal → Sprachkanal: „Musik von Bots“ einschalten
#   3. .env.example nach .env kopieren und ausfüllen
#   4. docker compose up -d   – dann im Kanal: !music
#
# Der Bot spricht den Chat-Server direkt im Docker-Netz an (ohne Reverse-Proxy) – so wird der
# Musik-Stream nicht gepuffert. Das Netz „ucng_default“ legt deploy/chat/compose.yml an.
# Läuft der Chat woanders: den Block „networks“ entfernen und UCNG_URL auf dessen Adresse
# setzen (im Reverse-Proxy dann das Puffern des Request-Bodys abschalten, nginx:
# proxy_request_buffering off;).

name: ucng-music

services:
  music:
    image: ghcr.io/b1tsnetwork/ucng-bot-music:${UCNG_VERSION:-latest}
    container_name: ucng-bot-music
    restart: unless-stopped
    environment:
      UCNG_URL: ${UCNG_URL:-http://ucng:8080}
      UCNG_BOT_TOKEN: ${UCNG_BOT_TOKEN:?UCNG_BOT_TOKEN in .env setzen (Admin → Bots)}
      MUSIC_ROOM: ${MUSIC_ROOM:-}      # fester Sprachkanal; leer = Kanal, in dem der Befehl kommt
      PREFIX: ${PREFIX:-!}
      TEAM_ONLY: ${TEAM_ONLY:-0}       # 1 = nur das Team darf steuern
      VOLUME: ${VOLUME:-20}
      BITRATE: ${BITRATE:-128}
      MAX_QUEUE: ${MAX_QUEUE:-500}
      YTDLP_UPDATE: ${YTDLP_UPDATE:-1} # beim Start neueste yt-dlp-Fassung holen
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Dein Musik-Ordner – nur lesend
      - ${MUSIC_PATH:-./music}:/music:ro
    tmpfs:
      # Downloads, yt-dlp-Update und Caches; mehr Platz für lange YouTube-Videos
      - /tmp:size=${TMP_SIZE:-1g},uid=10001,gid=10001,mode=0700
    networks:
      - chat
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chat:
    external: true
    name: ucng_default   # Netz des Chat-Projekts (deploy/chat, Projektname „ucng“)
