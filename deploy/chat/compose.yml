#
# UCNG – Chat-Server
#   1. .env.example nach .env kopieren und ausfüllen
#   2. docker compose up -d
#   3. Admin-Bereich: https://<deine-adresse>/admin
#
# Der Port ist nur lokal erreichbar (127.0.0.1) – davor gehört ein Reverse-Proxy mit HTTPS
# (Caddy, nginx, Traefik …), der auf http://127.0.0.1:${UCNG_PORT:-8080} weiterleitet.
# Wichtig für den Proxy: Server-Sent Events (Puffer aus, lange Timeouts) und WebSockets
# für die Sprachkanäle (Upgrade-Kopfzeilen, siehe README → Sprachkanäle).

name: ucng

services:
  chat:
    image: ghcr.io/b1tsnetwork/ucng:${UCNG_VERSION:-latest}
    container_name: ucng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UCNG_PORT:-8080}:8080"
    environment:
      # Öffentliche Adresse mit https:// – nötig für Links in E-Mails, Föderation und Beacon.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL in .env setzen}
      # Fest gesetzt, sonst wird bei jedem Start ein neues erzeugt (steht dann im Log).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      # simple = Namen ohne Konto, hosted = Konten, 2FA, verschlüsselte DMs, Föderation
      MODE: ${MODE:-simple}
      # files (Standard) oder sqlite – beides im Volume /data
      STORAGE: ${STORAGE:-files}
      # Hinter dem Reverse-Proxy: echte Client-IP aus X-Forwarded-For – nur von vertrauenswürdigen
      # Proxys (Standard: Loopback und private Netze, z. B. das Docker-Netz). Bei einem CDN davor
      # dessen Adressbereiche in TRUSTED_PROXIES ergänzen.
      TRUST_PROXY: "1"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Gleichzeitige Live-Verbindungen (jeder offene Tab ist eine)
      MAX_STREAMS: ${MAX_STREAMS:-10000}
      MAX_STREAMS_PER_IP: ${MAX_STREAMS_PER_IP:-50}
      # Zusätzlich erlaubte Seiten für das Widget (kommagetrennt), sonst Einstellung im Admin
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      RATE_LIMIT: ${RATE_LIMIT:-10}
      # Nur setzen, wenn du eine eigene, veränderte Fassung betreibst (AGPL):
      # Adresse deines Quellcodes. Offizielle Images bringen sie schon mit.
      SOURCE_URL: ${SOURCE_URL:-}
      # Sprachkanäle: eingebauter Relay (Grenzen) und Schlüssel für weitere Sprach-Server
      # (deploy/voice). Der Reverse-Proxy muss WebSockets durchreichen (/api/voice/ws).
      VOICE: ${VOICE:-1}
      VOICE_BUILTIN: ${VOICE_BUILTIN:-1}
      VOICE_MAX_PARTICIPANTS: ${VOICE_MAX_PARTICIPANTS:-200}
      VOICE_MAX_MBIT: ${VOICE_MAX_MBIT:-50}
      VOICE_AGENT_TOKEN: ${VOICE_AGENT_TOKEN:-}
      # Untertitel über die eigene Spracherkennung (deploy/stt) – leer = keine Untertitel.
      # Der Ton geht nur an diese Adresse, nie an fremde Dienste.
      STT_URL: ${STT_URL:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_TOKEN: ${STT_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Kanäle, Nachrichten, Einstellungen, Bilder und Backups (/data/backups)
      - ucng-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ucng-data:
