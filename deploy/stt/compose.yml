#
# Eigene Spracherkennung für Untertitel und Live-Transkription (Whisper über speaches,
# OpenAI-kompatibel). Der Ton bleibt auf deinem Server – kein Port nach außen, nur im Docker-Netz.
#
#   1. .env.example nach .env kopieren, docker compose up -d
#      (lädt beim ersten Start das Modell, siehe Dienst „stt-model“)
#   2. Beim Chat-Server (deploy/chat/.env) – oder bei einem Sprach-Server (deploy/voice/.env),
#      der selbst verschriftlichen soll:
#        STT_URL=http://ucng-stt:8000/v1/audio/transcriptions
#        STT_MODEL=Systran/faster-whisper-small      (genau das Modell von hier)
#      und dort neu starten:  docker compose up -d
#   3. Admin → Kanal → Sprachkanal: „Untertitel und Live-Transkription“ einschalten;
#      Admin → Sprach-Server zeigt, wo verschriftlicht wird und ob es klappt
#
# Läuft der Sprach-Server auf einem anderen Rechner, diese Datei dort starten und den Block
# „networks“ an das Docker-Netz des Sprach-Servers anpassen (oder entfernen).
# Modelle: siehe .env.example.

name: ucng-stt

services:
  stt:
    image: ghcr.io/speaches-ai/speaches:${STT_IMAGE_TAG:-latest-cpu}
    container_name: ucng-stt
    restart: unless-stopped
    environment:
      # Modell nach der letzten Anfrage so lange im Speicher halten (Sekunden; -1 = immer)
      STT_MODEL_TTL: ${STT_MODEL_TTL:--1}
      ENABLE_UI: "false"   # keine Weboberfläche nötig
      # Optional: Schlüssel – dann denselben Wert als STT_TOKEN beim Chat setzen
      API_KEY: ${STT_TOKEN:-}
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - chat
    # Mit NVIDIA-GPU: STT_IMAGE_TAG=latest-cuda und diesen Block einkommentieren
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Lädt das Modell einmalig herunter (danach liegt es im Volume) und beendet sich.
  stt-model:
    image: curlimages/curl:8.10.1
    depends_on: [stt]
    restart: "no"
    networks:
      - chat
    entrypoint: ["sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if curl -fsS -X POST -H "Authorization: Bearer ${STT_TOKEN:-}" "http://ucng-stt:8000/v1/models/${STT_MODEL:-Systran/faster-whisper-small}" >/dev/null; then
            echo "Modell ${STT_MODEL:-Systran/faster-whisper-small} ist bereit."; exit 0
          fi
          sleep 5
        done
        echo "Modell konnte nicht geladen werden"; exit 1

volumes:
  stt-models:

networks:
  chat:
    external: true
    name: ucng_default   # Netz des Chat-Projekts (deploy/chat, Projektname „ucng“)
