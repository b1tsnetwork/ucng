#
# Contributor License Agreement: Beim ersten Pull Request bittet der Assistent um Zustimmung zu
# CLA.md (Kommentar im Pull Request). Unterschriften liegen im Branch "cla-signatures".
# Der Workflow führt keinen Code aus dem Pull Request aus (deshalb ist pull_request_target sicher).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA unterschrieben
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA-Assistent
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
